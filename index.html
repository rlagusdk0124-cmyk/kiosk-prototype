<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙박 키오스크 체크인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 1080×1920 세로 키오스크 화면을 뷰포트에 맞춰 스케일. 시안의 퍼플 원톤 + 쿨그레이 뉴트럴 그대로 */
:root{
  --primary:#4A22E0; --primary-press:#3915C4; --primary-soft:#E4DFFB;
  --ink:#1B1C21; --sub:#4E535E; --muted:#8B92A0; --line:#E3E6EC;
  --chip:#D3D9E3; --done:#E4E8EF; --soft:#F4F6F9; --card:#FFFFFF;
  --bezel:#E4E6EB; --danger:#D93A3F; --disabled:#C7CCD7;
  --font:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bezel);font-family:var(--font);color:var(--ink);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#kiosk{position:absolute;left:50%;top:50%;width:1634px;height:1001px;transform-origin:center}
.kpart{position:absolute;overflow:hidden;width:597px}
#kA{left:380px;top:0;height:1001px}
#kB{left:1037px;top:300px;height:465px}
.kimg{position:absolute;left:0;top:0;width:597px;height:1466px;max-width:none;pointer-events:none}
#kB .kimg{top:-1001px;-webkit-mask-image:linear-gradient(#000 93%,transparent);mask-image:linear-gradient(#000 93%,transparent)}
.kcap{position:absolute;left:1037px;top:785px;width:597px;text-align:center;font-size:22px;color:#6B7280;letter-spacing:.5px}
#screen{position:absolute;left:44px;top:83.5px;width:501px;height:891px;overflow:hidden;background:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--card);overflow:hidden;
  display:flex;flex-direction:column;transform:scale(.463889);transform-origin:0 0}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)}
.ucap{position:absolute;left:0;top:930px;width:370px;text-align:center;font-size:22px;color:#6B7280;letter-spacing:.5px;opacity:0;transition:opacity .4s}
#kiosk.ph-on .ucap{opacity:1}
#phone{position:absolute;left:40px;top:330px;width:290px;height:580px;border-radius:46px;background:transparent;border:12px solid #0E0E11;box-shadow:0 0 0 2px #2A2B30,0 24px 50px rgba(20,24,40,.35);z-index:6;opacity:0;pointer-events:none;
  transform:translateX(-50px) rotate(-6deg);transition:transform .75s cubic-bezier(.5,0,.2,1),opacity .4s}
#phone.on{opacity:1;transform:rotate(-6deg)}
#phone.home{pointer-events:auto;cursor:pointer}
#phone.home:hover{transform:rotate(-6deg) translateY(-6px)}
.pv-home .tap{margin-top:8px;height:44px;padding:0 20px;border-radius:22px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,34,224,.45)}60%{box-shadow:0 0 0 12px rgba(74,34,224,0)}}
#phone.cam,#phone.found{transform:translate(489px,-135px) rotate(0deg)}
#phone.carrier,#phone.form,#phone.auth,#phone.done{transform:none}
#phone .notch{position:absolute;top:10px;left:50%;width:84px;height:24px;margin-left:-42px;border-radius:12px;background:#000;z-index:3}
#pscr{position:absolute;inset:0;border-radius:34px;overflow:hidden}
#pscr>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .2s;font-family:var(--font);-webkit-font-smoothing:antialiased}
#phone.carrier .pv-carrier,#phone.form .pv-form,#phone.home .pv-home,#phone.cam .pv-cam,#phone.found .pv-cam,#phone.auth .pv-auth,#phone.done .pv-done{opacity:1}
.pv-home{background:#F4F6F9;color:var(--sub);gap:18px;font-size:19px;line-height:1.5}
.pv-home .ic{width:76px;height:76px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pv-home .ic svg{width:40px;height:40px}
.pv-cam{background:radial-gradient(ellipse at center,rgba(20,20,26,0) 55%,rgba(20,20,26,.45) 100%),rgba(20,20,26,.1);-webkit-backdrop-filter:saturate(.8) contrast(1.08) brightness(1.04);backdrop-filter:saturate(.8) contrast(1.08) brightness(1.04);justify-content:flex-start!important}
.pv-cam .grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(33.3% - .5px),rgba(255,255,255,.35) calc(33.3% - .5px),rgba(255,255,255,.35) calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.35) calc(66.6% - .5px),rgba(255,255,255,.35) calc(66.6% + .5px),transparent calc(66.6% + .5px)),linear-gradient(transparent calc(33.3% - .5px),rgba(255,255,255,.35) calc(33.3% - .5px),rgba(255,255,255,.35) calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.35) calc(66.6% - .5px),rgba(255,255,255,.35) calc(66.6% + .5px),transparent calc(66.6% + .5px))}
.pv-cam .top{position:absolute;top:0;left:0;right:0;height:56px;background:rgba(0,0,0,.55)}
.pv-cam .bot{position:absolute;bottom:0;left:0;right:0;height:96px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.pv-cam .shut{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.6),0 0 0 7px #fff}
.pv-cam .mode{position:absolute;top:-30px;left:0;right:0;font-size:14px;font-weight:700;color:#FFD54A;letter-spacing:1px}
.pv-cam .fr{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.pv-cam .fr i{position:absolute;width:36px;height:36px;border:5px solid #7B5CFF}
.pv-cam .fr i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.pv-cam .fr i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.pv-cam .fr i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.pv-cam .fr i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
#phone.found .fr{transform:scale(.88)}
.pv-cam .hint{position:absolute;bottom:130px;left:0;right:0;color:#fff;font-size:18px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pv-cam .bn{position:absolute;top:58px;left:14px;right:14px;background:rgba(255,255,255,.95);border-radius:16px;padding:12px 14px;text-align:left;font-size:16px;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateY(-120px);transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.pv-cam .bn{opacity:0;transition:none}
.pv-cam .bn b{display:block;font-size:17px}.pv-cam .bn span{color:var(--muted);font-size:15px}
#phone.found .bn{transform:none;opacity:1;transition:transform .45s .2s cubic-bezier(.3,1.3,.5,1),opacity .2s .2s}
.pv-carrier,.pv-form{background:#fff;justify-content:flex-start!important;align-items:stretch!important;text-align:left!important;padding:58px 20px 20px;gap:0;color:var(--ink)}
.ph-h{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}
.ph-h em{font-style:normal;font-size:12px;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:3px 8px}
.ph-t{font-size:20px;font-weight:800;line-height:1.4;margin:18px 0 16px}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clist div{height:64px;border:1.5px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--sub);transition:all .25s}
#phone.picked .clist .c1{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);transform:scale(.97)}
.pv-form label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
.pv-form label b{display:flex;align-items:center;height:38px;border-bottom:1.5px solid var(--line);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.pv-form .sx{margin-left:6px;color:var(--muted);font-weight:500}.pv-form .sx u{text-decoration:none;color:var(--ink)}
.pv-form .cur{display:none;}
#phone.k1 .cur.c1,#phone.k2 .cur.c2,#phone.k3 .cur.c3{display:block;width:2px;height:20px;background:var(--primary);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#phone.k1 .pv-form label:nth-of-type(1) b,#phone.k2 .pv-form label:nth-of-type(2) b,#phone.k3 .pv-form label:nth-of-type(3) b{border-color:var(--primary)}
.pv-form .agree{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:6px}
.pv-form .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--chip);transition:all .2s;flex:none}
#phone.agree .pv-form .cb{background:var(--primary);border-color:var(--primary);box-shadow:inset 0 0 0 3px #fff}
.pv-form .go{margin-top:auto;height:50px;border-radius:12px;background:var(--disabled);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;transition:background .2s,transform .15s}
#phone.agree .pv-form .go{background:var(--primary)}
#phone.press .pv-form .go{transform:scale(.95);background:var(--primary-press)}
.pv-auth .code{display:flex;gap:6px;margin-top:6px}
.pv-auth .code i{width:30px;height:40px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:19px;font-weight:700;color:transparent;transition:color .2s}
#phone.auth .pv-auth .code i{color:var(--ink)}
#phone.auth .pv-auth .code i:nth-child(2){transition-delay:.15s}#phone.auth .pv-auth .code i:nth-child(3){transition-delay:.3s}
#phone.auth .pv-auth .code i:nth-child(4){transition-delay:.45s}#phone.auth .pv-auth .code i:nth-child(5){transition-delay:.6s}#phone.auth .pv-auth .code i:nth-child(6){transition-delay:.75s}
.pv-auth{background:#fff;color:var(--ink);gap:14px;padding:0 26px}
.pv-auth .t{font-size:24px;font-weight:800}
.pv-auth .who{font-size:18px;color:var(--sub);line-height:1.6}
.pv-auth .bar{width:100%;height:8px;border-radius:4px;background:var(--done);overflow:hidden;margin-top:14px}
.pv-auth .bar i{display:block;height:100%;width:0;background:var(--primary)}
#phone.auth .pv-auth .bar i{width:100%;transition:width 1.1s ease-in-out}
.pv-auth .s{font-size:16px;color:var(--muted)}
.pv-done{background:#fff;gap:18px}
.pv-done .ok{width:96px;height:96px;border-radius:50%;background:var(--primary);display:grid;place-items:center;transform:scale(.4);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#phone.done .ok{transform:none}
.pv-done .ok svg{width:52px;height:52px;color:#fff}
.pv-done b{font-size:24px}.pv-done span{font-size:17px;color:var(--muted);line-height:1.5}
.pslot{position:absolute;top:311px;height:160px;width:92px;overflow:hidden;cursor:pointer}
#ps1{left:258px}#ps2{left:422px}
.pslot i{position:absolute;left:5px;top:0;width:82px;display:block;transform:translateY(-100%)}
#prcpt::before{content:attr(data-room);position:absolute;left:10px;top:16px;font:700 13px Arial,sans-serif;color:#4E535E}
#pcard{height:130px;border-radius:6px;background:linear-gradient(#EEF0F5,#D5DAE4);box-shadow:0 3px 6px rgba(0,0,0,.35)}
#pcard::after{content:"cardkey";position:absolute;right:8px;bottom:8px;font:700 10px Arial,sans-serif;color:#9AA1AE}
#prcpt{height:140px;background:#fff;background-image:repeating-linear-gradient(#fff 0 9px,#D3D8E0 9px 11px);background-size:62px 66px;background-position:10px 40px;background-repeat:no-repeat;box-shadow:0 3px 6px rgba(0,0,0,.25)}
#kiosk.p1 #pcard,#kiosk.p2 #pcard,#kiosk.p3 #pcard,#kiosk.pfull #pcard{transform:none;transition:transform .6s cubic-bezier(.25,.8,.3,1)}
#kiosk.p2 #prcpt{transform:translateY(-50%);transition:transform .7s cubic-bezier(.25,.8,.3,1)}
#kiosk.p3 #prcpt,#kiosk.pfull #prcpt{transform:none;transition:transform 1s linear}
#kiosk.ptake .pslot i{transform:translateY(40px);opacity:0;transition:transform .4s ease-in,opacity .4s ease-in}
#stage.gray{background:var(--soft)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[data-act]:focus-visible{outline:4px solid var(--primary);outline-offset:3px}
*{box-sizing:border-box}

/* 스텝퍼 */
.stepper{position:relative;flex:none;height:150px;padding-top:27px;padding-left:3px;display:grid;grid-template-columns:repeat(6,179px)}
.stepper::before{content:"";position:absolute;top:56px;left:93px;right:93px;height:3px;background:var(--line)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#view.enter>.body{animation:enter .38s cubic-bezier(.22,.8,.3,1) both}
#view.enter>.foot{animation:fadein .38s ease-out both}
#view.leave>.body{animation:leave .16s ease-in both}
#view.leave>.foot{animation:fadeout .16s ease-in both}
@keyframes enter{from{opacity:0;transform:translateX(40px)}}
@keyframes leave{to{opacity:0;transform:translateX(-24px)}}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.st .c,.st .l{transition:background-color .35s,color .35s}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.st .c{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--chip);color:#5B6170}
.st .c svg{width:30px;height:30px}
.st.done .c{background:var(--done);color:#8A93A3}
.st.cur .c{background:var(--primary-soft);color:var(--primary);font-weight:700}
.st .l{font-size:23px;color:var(--sub);white-space:nowrap}
.st.done .l{color:var(--muted)}
.st.cur .l{color:var(--ink);font-weight:700}

.body{flex:1;min-height:0;display:flex;flex-direction:column}
.head{padding:62px 48px 44px;background:var(--card)}
.head.c{text-align:center;padding-top:150px}
h1{margin:0;font-size:64px;font-weight:800;letter-spacing:-1.6px;line-height:1.35;text-wrap:balance}
.sub{margin:22px 0 0;font-size:30px;color:var(--sub);line-height:1.45}
.scroll{flex:1;min-height:0;overflow-y:auto;background:var(--soft);border-top:1px solid var(--line);padding:32px 48px 40px;display:flex;flex-direction:column;gap:18px}
.scroll>*{flex-shrink:0}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#9AA1AE;border-radius:3px}

/* 하단 */
.foot{flex:none;padding-top:30px}
.cta{display:flex;gap:32px;padding:0 48px}
.btn-prev{width:280px;height:130px;border:1.5px solid #8B92A0;border-radius:16px;background:#fff;font-size:52px;font-weight:700}
.btn-main{flex:1;height:130px;border:0;border-radius:16px;background:var(--primary);color:#fff;font-size:52px;font-weight:700;letter-spacing:-1px;transition:background .15s}
.btn-main:active{background:var(--primary-press)}
.btn-main:disabled{background:var(--disabled);cursor:default}
.nav{height:136px;display:flex;justify-content:center;align-items:center;gap:110px}
.nav button{border:0;background:none;display:flex;align-items:center;gap:20px;font-size:30px;color:var(--ink);padding:16px}
.nav svg{width:42px;height:42px}

/* 1. 예약 조회 */
.seg{margin:94px auto 0;width:600px;padding:6px;border-radius:14px;background:#E3E7EE;display:grid;grid-template-columns:repeat(3,1fr)}
.seg button{height:86px;border:0;border-radius:10px;background:none;font-size:30px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(20,24,40,.08)}
.field{margin:64px auto 0;width:644px;height:110px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:0;font-size:46px;font-variant-numeric:tabular-nums}
.field{position:relative}
.field .cc{display:flex;align-items:center;gap:14px;margin-right:78px;border:0;background:none;font:inherit;font-size:46px;padding:10px 12px;margin-left:-12px;border-radius:10px;min-width:150px}
.field .cc.open{background:#E6E9EF}
.field .cc.open i{transform:rotate(180deg)}
.field .free{font-size:44px;letter-spacing:2px}
.field .ph.free{letter-spacing:0;font-size:38px}
.ccback{position:absolute;left:-400px;right:-400px;top:-900px;bottom:-1400px;z-index:9}
.cclist{position:absolute;left:0;top:118px;width:440px;max-height:600px;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(20,24,40,.18),0 0 0 1px var(--line);z-index:10;padding:8px;animation:fade .15s}
.cclist button{width:100%;height:84px;border:0;background:none;border-radius:10px;display:flex;align-items:center;gap:22px;padding:0 22px;text-align:left}
.cclist button:active{background:var(--soft)}
.cclist b{width:90px;font-size:30px;font-variant-numeric:tabular-nums}
.cclist span{flex:1;font-size:28px;color:var(--sub)}
.cclist .on b,.cclist .on span{color:var(--primary)}
.cclist svg{width:30px;height:30px;color:var(--primary)}
.field .cc i{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:13px solid var(--ink)}
.field .dash{color:#B8C2D6;margin:0 12px}
.field .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#B8C0CC;margin:0 10px}
.field .dot.on{background:var(--ink)}
.field .ph{color:#8B92A0}
.field.err{border-color:var(--danger)}
.resv{display:flex;gap:16px;border:0;width:auto}
.resv span{width:86px;height:110px;border-bottom:3px solid var(--chip);display:grid;place-items:center;font-size:56px;font-weight:700}
.resv span.on{border-color:var(--ink)}
.resv span.next{border-color:var(--primary)}
.errmsg{height:48px;margin-top:14px;text-align:center;font-size:26px;color:var(--danger)}
.pad{margin:0 auto;display:grid;grid-template-columns:repeat(3,148px);gap:16px}
.pad button{height:148px;border:0;border-radius:16px;background:#fff;box-shadow:0 2px 5px rgba(20,24,40,.07);font-size:62px;font-weight:400}
.pad button:active{background:var(--primary-soft)}
.pad .sm{font-size:28px;font-weight:500}
.pad svg{width:58px;height:40px}
.demo{margin-top:auto;padding-bottom:10px;text-align:center;font-size:22px;color:var(--muted)}
.qrwrap{margin:70px auto 0;display:flex;flex-direction:column;align-items:center;gap:36px}
.scanner{width:520px;height:420px;border-radius:28px;background:#2D3039;position:relative;display:grid;place-items:center}
.scanner .win{width:380px;height:260px;border-radius:16px;background:#3C404B;position:relative;overflow:hidden}
.scanner .win::after{content:"";position:absolute;left:0;right:0;height:4px;background:#8E7BFF;box-shadow:0 0 24px 6px rgba(142,123,255,.6);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:12%}50%{top:86%}}
.qr-hint{font-size:32px;font-weight:700}
.ghost{height:84px;padding:0 40px;border-radius:42px;border:1.5px solid var(--chip);background:#fff;font-size:28px;color:var(--sub);display:inline-flex;align-items:center;gap:16px}

/* 2. 객실 선택 */
.summary{margin-top:44px;border:1px solid var(--line);border-radius:16px;padding:30px 32px}
.summary b{font-size:30px}
.summary .row{margin-top:20px;display:flex;font-size:27px;color:var(--sub)}
.summary .row span{padding-right:42px;margin-right:42px;border-right:1px solid var(--line);white-space:nowrap}
.summary .row span:last-child{border:0;margin:0;padding:0}
.summary .row em{font-style:normal;color:var(--ink);margin-left:14px}
.selbar{display:flex;align-items:center;gap:18px;font-size:30px;padding:4px 0 6px}
.selbar button{border:0;background:none;display:flex;align-items:center;gap:16px;font-size:30px;padding:0}
.ck{width:36px;height:36px;border-radius:50%;background:var(--done);color:#8A93A3;display:grid;place-items:center;flex:none}

.room .nm{font-size:40px;font-weight:800;letter-spacing:-.6px}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:8px;width:max-content}

/* 3. 인원 확인 */
.gcard{background:#fff;border-radius:16px;border:1px solid var(--line);padding:32px 32px 0}

.tot{display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--sub);padding:6px 4px}

/* 4. 약관 */

/* 모달 */
.overlay{position:absolute;inset:0;background:rgba(20,22,28,.45);display:grid;place-items:center;z-index:20;animation:fade .2s}

.mbtns{margin-top:94px;display:flex;justify-content:center;gap:40px}

.mfield{margin:40px auto 0;width:560px;justify-content:center}
.mpad{margin:36px auto 0;width:max-content;grid-template-columns:repeat(3,128px);gap:12px}
.mpad button{height:100px;font-size:46px;background:var(--soft);box-shadow:none}
.mpad .sm{font-size:24px}
.mbtns button:disabled{background:var(--disabled);cursor:default}
.mbtns button{width:315px;height:90px;border-radius:6px;font-size:34px;font-weight:700}
.mbtns .o{background:#fff;border:1.5px solid #8B92A0}
.mbtns .p{background:var(--primary);color:#fff;border:0}

/* 4-2. 안내 / 인증 */
.how{border-top:1px solid var(--line);padding:38px 0 0 160px;display:flex;gap:0}
.how div{width:276px;position:relative}
.how div+div::before{content:"";position:absolute;left:-40px;top:66px;width:14px;height:14px;border-top:2px solid #C5CBD6;border-right:2px solid #C5CBD6;transform:rotate(45deg)}
.how b{display:block;font-size:34px;font-weight:700}
.how strong{display:block;margin-top:8px;font-size:30px;font-weight:500}
.how p{margin:16px 0 0;font-size:23px;color:var(--muted);line-height:1.45}
.how .act strong{color:var(--primary);font-weight:700}
.illo{margin:90px auto 0;width:860px;height:499px;position:relative}
.gsvg{width:100%;height:100%;display:block;overflow:visible}
.gsvg #ph{transform-origin:481px 305px;transform:translate(-143px,40px) rotate(-10deg);transition:transform .9s cubic-bezier(.5,0,.2,1)}
.gsvg.s-scan #ph,.gsvg.s-found #ph{transform:none}
.gsvg.s-done #ph{transform:translate(-113px,17px) rotate(-10deg)}
.gsvg #cam{opacity:0;transition:opacity .45s .35s}

.gsvg.s-scan #scr,.gsvg.s-found #scr{opacity:0}

.gsvg.s-scan #cam,.gsvg.s-found #cam{opacity:.62}
.gsvg.s-done #cam{transition-delay:0s}
.gsvg #corners{opacity:0;transform-origin:481px 294px;transition:opacity .35s,transform .35s cubic-bezier(.3,1.4,.5,1)}
.gsvg.s-scan #corners{opacity:1;transition-delay:.7s,0s}
.gsvg.s-found #corners{opacity:1;transform:scale(.9)}
.gsvg #vqr{opacity:0;transform-origin:482px 293px;transform:scale(.75);transition:opacity .3s,transform .4s cubic-bezier(.3,1.4,.5,1)}
.gsvg.s-found #vqr{opacity:1;transform:none}
.gsvg #spark line{opacity:0;stroke-dasharray:30;stroke-dashoffset:30}
.gsvg.s-found #spark line{animation:spark .9s .25s ease-out both}
.gsvg.s-found #spark line:nth-child(2){animation-delay:.32s}
.gsvg.s-found #spark line:nth-child(3){animation-delay:.39s}
@keyframes spark{0%{opacity:0;stroke-dashoffset:30}35%{opacity:1;stroke-dashoffset:0}75%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:-30}}
.gsvg #ok{opacity:0;transform-origin:481px 300px;transform:scale(.4);transition:opacity .2s,transform .2s}
.gsvg.s-done #ok{opacity:1;transform:none;transition:opacity .3s .55s,transform .45s .55s cubic-bezier(.3,1.6,.5,1)}
.how div,.how strong{transition:color .3s}
.illo .blob{position:absolute;left:0;top:6px;width:700px;height:488px;border-radius:50%;background:#DDDAF0}

.illo .k .bt{position:absolute;top:254px;height:38px;width:80px;border-radius:4px;background:#565B67}

.illo .ph::before{content:"";position:absolute;left:10px;right:10px;top:44px;bottom:60px;background:#EEEEF3}
.illo .ph::after{content:"";position:absolute;left:50%;bottom:16px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#D9D9DE;border:3px solid #555}
@keyframes tilt{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-4deg) translateX(30px)}}
.tap{text-align:center;font-size:26px;color:var(--muted);margin-top:auto;padding-bottom:60px}
.authqr{margin:46px auto 0;width:340px;height:340px;border:0;background:#fff;padding:0;display:block}
.authqr svg{width:100%;height:100%;display:block}
.idbtn{margin:44px auto 0;display:flex}
.log{margin-top:62px;height:122px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden}
.log span{display:block;line-height:1.35;white-space:nowrap}
.log .p0{font-size:28px;color:var(--ink);height:40px}
.log .p0 b{font-weight:700}
.log .p1{font-size:23px;color:var(--sub);height:34px}
.log .p2{font-size:17px;color:#C5CBD6;height:26px}
.log .p3{font-size:12px;color:#E3E6EC;height:0;opacity:0}
.log .empty{font-size:24px;color:var(--muted)}
.log.shift .p0{animation:lg0 .55s cubic-bezier(.2,.8,.3,1) both}
.log.shift .p1{animation:lg1 .55s cubic-bezier(.2,.8,.3,1) both}
.log.shift .p2{animation:lg2 .55s cubic-bezier(.2,.8,.3,1) both}
.log.shift .p3{animation:lg3 .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes lg0{from{opacity:0;transform:translateY(24px);height:0}}
@keyframes lg1{from{font-size:28px;color:var(--ink);height:40px}}
@keyframes lg2{from{font-size:23px;color:var(--sub);height:34px}}
@keyframes lg3{from{font-size:17px;color:#C5CBD6;height:26px;opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.prog{margin:40px 48px 0}
.prog .bar{height:38px;border-radius:12px;background:#DDDAF0;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.prog .bar i{display:block;height:100%;background:var(--primary);border-radius:12px;transition:width .9s cubic-bezier(.3,.7,.4,1)}
.prog .lb em{font-style:normal;color:var(--primary)}
.prog .lb{margin-top:20px;display:flex;justify-content:space-between;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}

/* 5. 카드키 */
.issue{padding:72px 48px 0}
.ihead{display:flex;justify-content:space-between;align-items:baseline;font-size:32px;font-weight:700}
.ihead em{font-style:normal;color:var(--primary)}
.panel{margin-top:30px;border:1px solid var(--line);border-radius:16px;height:560px;text-align:center;padding-top:28px;position:relative}
.panel h3{margin:0;font-size:36px;font-weight:800}
.disp{position:relative;margin:18px auto 0;width:400px;height:285px;display:block;border:0;background:none;padding:0}
.disp svg{width:100%;height:100%;display:block;overflow:visible}
button.disp{cursor:pointer}
.disp #kc{transform:translateY(-112px);transition:transform .6s cubic-bezier(.25,.8,.3,1)}
.disp.d1 #kc,.disp.d2 #kc,.disp.d3 #kc,.disp.dfull #kc{transform:none}
.disp #rc{transform:translateY(-124px);transition:transform .7s cubic-bezier(.25,.8,.3,1)}
.disp.d2 #rc{transform:translateY(-52px)}
.disp.d3 #rc,.disp.dfull #rc{transform:none;transition-duration:1s;transition-timing-function:linear}
.disp.dfull *{transition:none!important}
.disp.dfull #kc,.disp.dfull #rc{animation:nudge 1.8s .3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(5px)}}
.disp.dtake #kc,.disp.dtake #rc{transform:translateY(70px);opacity:0;transition:transform .4s ease-in,opacity .4s ease-in}
.disp .box{position:relative;z-index:2;width:380px;height:168px;border-radius:16px;background:#3A3D46}
.disp .slot{position:absolute;left:24px;right:24px;top:28px;height:84px;border-radius:8px;background:#55585F;display:flex;justify-content:space-between;padding:24px 20px}
.disp .slot span{width:124px;height:16px;border-radius:5px;background:#16171A;position:relative}
.disp .slot span::after{content:"";position:absolute;left:54px;top:30px;width:16px;height:6px;border-radius:3px;background:#2A2B30}
.arrow{position:absolute;left:120px;top:194px;width:140px;height:78px}
.out{position:absolute;top:150px;left:44px;right:44px;height:120px;display:flex;justify-content:space-between;padding:0 24px;z-index:1;border:0;background:none}
.out i{width:112px;border-radius:0 0 8px 8px;animation:drop .6s cubic-bezier(.2,.8,.3,1.1)}
.out .kc{background:linear-gradient(160deg,#6A46F0,#3B17C9);height:112px;position:relative}
.out .kc::after{content:var(--n);position:absolute;bottom:14px;left:0;right:0;color:#fff;font-size:20px;font-weight:700;font-style:normal}
.out .rc{background:#fff;height:96px;border:1px solid #D8DCE3;background-image:repeating-linear-gradient(#fff 0 14px,#E8EBF0 14px 17px);background-position:0 20px}
@keyframes drop{from{transform:translateY(-110px)}}
.out.show{cursor:pointer}
.out.show i{animation:drop .6s cubic-bezier(.2,.8,.3,1.1), wig 1.6s .8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.pmsg{margin-top:34px;font-size:30px;font-weight:700}
.psub{margin-top:18px;font-size:26px;color:var(--muted)}
.rows{margin-top:44px;display:flex;flex-direction:column;gap:18px}
.irow{height:120px;border:1.5px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 32px;gap:18px}
.irow.on{border-color:var(--primary)}
.num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--done);color:var(--sub);flex:none}
.num.on{background:var(--primary);color:#fff}
.num svg{width:28px;height:28px;color:#8A93A3}
.irow .n{flex:1;font-size:32px;font-weight:700;color:var(--ink)}
.irow.wait .n{color:var(--sub)}
.pill{width:142px;height:52px;border-radius:26px;display:grid;place-items:center;font-size:24px;background:var(--chip);color:var(--sub)}
.pill.p{background:var(--primary);color:#fff}
.pill.d{background:var(--done);color:var(--muted)}
.spin{width:36px;height:36px;border-radius:50%;border:3px dotted #4E535E;border-top-color:transparent;animation:sp 1s linear infinite;margin-right:24px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 6. 완료 */
.fin>*{flex-shrink:0}
.fin{padding:0 48px;display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto}
.fin .head{padding:150px 0 46px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;padding:30px 0}
.stats div{text-align:center;display:flex;flex-direction:column;gap:22px}
.stats div+div{border-left:1px solid var(--line)}
.stats span{font-size:26px;color:var(--sub)}
.stats b{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.acc{margin-top:48px;border:1px solid var(--line);border-radius:16px}
.acc>button{width:100%;border:0;background:none;display:flex;align-items:center;gap:26px;padding:34px 40px 30px 32px;text-align:left}
.acc .ck{width:60px;height:60px;background:var(--primary-soft);color:var(--primary)}.acc .ck svg{width:32px;height:32px}
.acc .t{flex:1}
.acc .t b{display:block;font-size:30px;font-weight:700}
.acc .t span{display:block;margin-top:12px;font-size:24px;color:var(--sub)}
.acc .chev{width:40px;height:40px;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.acc ul{list-style:none;margin:0;padding:0 40px 24px 118px;display:flex;flex-direction:column;gap:12px}
.acc li{display:flex;justify-content:space-between;font-size:26px;color:var(--sub);border-top:1px solid var(--line);padding-top:14px}
.acc li b{color:var(--ink);font-weight:500}
.hr{height:2px;background:var(--line);margin:46px 0 0}
.rem h4{margin:58px 0 30px;font-size:34px;font-weight:700}
.rcard{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:16px;padding:24px 32px;margin-bottom:18px}
.rcard .th{width:100px;height:70px;border-radius:6px;overflow:hidden;flex:none}
.rcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.rcard .t{flex:1}
.rcard .t b{display:block;font-size:31px;font-weight:700}
.rcard .t span{display:block;margin-top:10px;font-size:24px}
.rcard button{align-self:flex-start;height:56px;padding:0 20px;border-radius:28px;border:1px solid var(--line);background:#fff;font-size:24px;color:var(--sub)}
.allok{margin-top:60px;text-align:center;font-size:28px;color:var(--sub);line-height:1.6}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* 시드 고정 의사난수 QR */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function qr(seed,n){
  const r=rng(seed),m=[];
  for(let y=0;y<n;y++){m.push([]);for(let x=0;x<n;x++)m[y].push(r()<.47)}
  const finder=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;const ring=Math.max(Math.abs(x-3),Math.abs(y-3));m[Y][X]=(x>=0&&x<7&&y>=0&&y<7)&&(ring===3||ring<=1)}};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  let p='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])p+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${p}" fill="#1B1C21"/></svg>`;
}

V.terms=()=>({html:`<div class="body"><div class="head" style="padding-bottom:46px"><h1>필수 약관 동의</h1><p class="sub">필수 약관에 모두 동의해야 이용이 가능합니다</p></div>

  <p>숙박시설 이용 약관</p><p><b>제1조 (목적)</b><br>본 약관은 본 숙박시설과 고객 간의 권리와 의무에 대하여 규정함을 그 목적으로 합니다.</p>
  <p><b>제2조 (용어의 정의)</b><br>본 약관에서 사용하는 용어의 정의는 다음과 같습니다.</p>
  <p>1. "키오스크"란 터치스크린과 사운드, 그래픽, 통신카드 등 첨단 멀티미디어 기기를 활용하여 음성서비스, 동영상 구현 등 고객에게 정보를 제공하기 위하여 본 숙박시설이 제공하는 무인정보단말기를 말합니다.</p>
  <p>2. "고객"이라 함은 "키오스크"를 통하여 예약, 결제를 하였는지 및 나이와 무관하게 본 숙박시설에 숙박예약을 희망하는 자 또는 실제 숙박하는 자를 의미합니다.</p>
  <p>3. "미성년자"는 대한민국 민법 제4조의 성년(19세)에 이르지 않은 자를 의미합니다.</p>
  <p><b>제3조 (입실 및 퇴실)</b><br>입실은 오후 2시부터, 퇴실은 다음 날 오전 10시까지이며 시간 초과 시 추가 요금이 발생할 수 있습니다.</p></div></div>
  <div class="tbox"><div class="th"><span class="req">필수</span>미성년자 출입 통제에 대한 동의</div><div class="tb">
  <p>본 서류에서 달리 정의하지 않은 용어의 경우 숙박시설 이용 약관과 동일한 의미로 사용합니다.</p>
  <p>본 서류는 미성년자의 본 숙박시설 이용 제한에 관한 중립 서류로만 활용됩니다. 귀하는 개인정보 수집 및 이용에 동의하지 않을 권리가 있으며, 동의하지 않을 경우 본 숙박시설 이용이 불가능합니다.</p>
  <p>개인정보는 보유 및 이용기간 종료 시 지체 없이 파기됩니다. 단, 관계법령의 규정에 의해 보존될 필요가 있는 경우 관계법령에서 정한 일정한 기간 동안 개인정보를 보관합니다.</p>
  <p>[미성년자 출입제한에 관한 동의 및 확인]<br>미성년자의 경우 본 숙박시설에의 출입 및 본 숙박시설의 이용이 원칙적으로 제한됩니다.</p>
  <p>미성년자의 이성간 혼숙이나 음주 및 흡연 등은 일체 허용되지 않으며, 미성년자의 혼숙이나 음주 또는 흡연 행위가 적발되는 경우 즉시 강제 퇴실 조치될 수 있습니다.</p></div></div></div></div>
  ${foot('동의하고 다음',{act:'agree'})}`});
const how=(a)=>`<div class="how">${[['1','QR코드 스캔하기','각자의 휴대폰으로<br>QR을 스캔해 주세요'],['2','본인 인증하기','휴대폰 화면 안내에 따라<br>인증을 진행해 주세요'],['3','인증 완료','모든 인원이 인증하면<br>객실키가 발급됩니다']].map(([n,t,d],i)=>`<div class="${i===a?'act':''}"><b>${n}</b><strong>${t}</strong><p>${d}</p></div>`).join('')}</div>`;
function qrAt(seed,n,x,y,w){return qr(seed,n).replace('<svg ',`<svg x="${x}" y="${y}" width="${w}" height="${w}" `)}
function guideSvg(){
  return `<svg class="gsvg s-rest" id="gsvg" viewBox="0 0 1000 580" aria-label="휴대폰으로 키오스크의 QR을 스캔하는 방법">
  <ellipse cx="492" cy="292" rx="350" ry="245" fill="#DDDAF0"/>
  <g id="spark" stroke="#4A22E0" stroke-width="6" stroke-linecap="round"><line x1="444" y1="75" x2="418" y2="66"/><line x1="463" y1="47" x2="452" y2="20"/><line x1="495" y1="36" x2="502" y2="8"/></g>
  <rect x="503" y="43" width="217" height="498" rx="14" fill="#3A3D46" stroke="#4C505B" stroke-width="3"/>
  <rect x="525" y="68" width="172" height="210" rx="8" fill="#fff" stroke="#BEBFC4" stroke-width="5"/>
  ${qrAt(7,13,551,112,120)}
  <rect x="526" y="300" width="80" height="36" rx="4" fill="#50545F"/><rect x="543" y="315" width="46" height="6" rx="3" fill="#2A2C32"/>
  <rect x="617" y="300" width="80" height="36" rx="4" fill="#50545F"/><rect x="630" y="315" width="22" height="6" rx="3" fill="#2A2C32"/><rect x="661" y="315" width="22" height="6" rx="3" fill="#2A2C32"/>
  <g id="ph">
    <rect x="398" y="136" width="166" height="46" fill="#1C1C1F"/>
    <rect x="398" y="418" width="166" height="56" fill="#1C1C1F"/>
    <rect id="scr" x="398" y="182" width="166" height="236" fill="#EEEEF3"/>
    <rect id="cam" x="398" y="182" width="166" height="236" fill="#B9B9C0"/>
    <rect x="391" y="129" width="180" height="352" rx="23" fill="none" stroke="#000" stroke-width="14"/>
    <g id="vqr">${qrAt(7,13,441,252,82)}</g>
    <g id="corners" fill="none" stroke="#4A22E0" stroke-width="5" stroke-linecap="square"><path d="M422 260v-24h24M516 236h24v24M540 328v24h-24M446 352h-24v-24"/></g>
    <g id="ok"><circle cx="481" cy="300" r="40" fill="#4A22E0"/><path d="M462 301l13 13 25-27" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
    <rect x="456" y="146" width="48" height="7" rx="3.5" fill="#33343A"/><circle cx="514" cy="149" r="3.5" fill="#33343A"/>
    <circle cx="481" cy="446" r="14" fill="#DADADF" stroke="#555" stroke-width="3"/>
  </g></svg>`;
}
function guideAnim(){
  const set=(p,step)=>{const g=document.getElementById('gsvg');if(!g)return;g.setAttribute('class','gsvg s-'+p);
    stage.querySelectorAll('.how>div').forEach((d,i)=>d.classList.toggle('act',i===step))};
  const loop=()=>{set('rest',0);later(()=>set('scan',0),900);later(()=>set('found',1),2600);later(()=>set('done',2),4100);later(loop,6000)};
  loop();
}
V.guide=()=>({html:`<div class="body" data-act="skipguide" style="cursor:pointer"><div class="head"><h1>${authTotal()}명의 성인인증이 필요해요</h1><p class="sub">아래 QR을 각자의 휴대폰으로 스캔하세요<br>모두 인증해야 다음으로 진행돼요</p></div>
  ${how(0)}<div class="illo">${guideSvg()}</div>
  <div class="tap">화면을 터치하면 인증을 시작해요</div></div>`});
V.auth=()=>{
  const n=authTotal(),d=st.authDone,done=d>=n,act=done?2:d>0?1:0;
  const L=st.authLog,shift=L.length!==st.logShown;st.logShown=L.length;
  const log=L.slice(-4).map((x,i,a)=>`<span class="p${a.length-1-i}"><b>${x}님</b> 의 인증이 완료됐습니다</span>`).join('');
  return {html:`<div class="body"><div class="head"><h1>${n}명의 성인인증이 필요해요</h1><p class="sub">아래 QR을 각자의 휴대폰으로 스캔하세요<br>모두 인증해야 다음으로 진행돼요</p></div>
  ${how(act)}<button class="authqr" data-act="qrauth" aria-label="QR 스캔 시뮬레이션">${qr(4242,33)}</button>
  <button class="ghost idbtn" data-act="idauth" ${done?'disabled':''}>신분증으로 인증하기 ${I.chevR}</button>
  <div class="log ${shift?'shift':''}" aria-live="polite">${log||'<span class="empty">휴대폰으로 인증하면 여기에 표시돼요</span>'}</div>
  <div class="prog"><div class="bar"><i data-w="${n?d/n*100:0}" style="width:${st.lastPct||0}%"></i></div><div class="lb"><span>인증 진행 상황</span><span><em>${d}</em>/${n} 명 완료</span></div></div></div>
  ${foot(done?`${n}명 인증 완료`:'성인인증 필요',{disabled:!done,act:'authnext'})}`};
};
V.issue=()=>{
  const q=st.queue,i=Math.min(st.issueIdx,q.length-1),r=room(q[i]),ready=st.issueState==='ready',end=st.issueState==='end';
  const rows=q.map((id,k)=>{const rr=room(id);
    if(k<st.issueIdx)return `<div class="irow"><span class="num">${I.check}</span><span class="n">${rr.type}&nbsp; ${rr.id}호</span><span class="pill d">완료</span></div>`;
    if(k===st.issueIdx)return `<div class="irow on"><span class="num ${ready?'':'on'}">${ready?I.check:k+1}</span><span class="n">${rr.type}&nbsp; ${rr.id}호</span>${ready?'':'<span class="spin"></span>'}<span class="pill p">${ready?'수령 대기':'발급 중'}</span></div>`;
    return `<div class="irow wait"><span class="num">${k+1}</span><span class="n">${rr.type}&nbsp; ${rr.id}호</span><span class="pill">대기</span></div>`}).join('');
  const arrow=`<svg class="arrow" viewBox="0 0 140 78"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#55585F"/></linearGradient></defs><path d="M38 0h64l12 46h26L70 78 0 46h26z" fill="url(#ag)"/></svg>`;
  return {html:`<div class="body"><div class="head" style="padding-bottom:0"><h1>카드키와 영수증을 받아 주세요</h1><p class="sub">카드키를 가져가면 다음 객실의 카드키가 자동으로 발급됩니다</p></div>
  <div class="issue"><div class="ihead"><span>발급 현황</span><span><em>${st.issueIdx}</em> / ${q.length} 객실</span></div>
  <div class="panel"><h3>${r.type} ${r.id}호</h3>${ready?`<button class="disp dfull" id="disp" data-act="take" aria-label="카드키와 영수증 가져가기">${dispSvg(r.id)}</button>`:`<div class="disp d0" id="disp">${dispSvg(r.id)}</div>`}
   <div class="pmsg">${end?'모든 카드키가 발급됐어요':ready?'카드키와 영수증을 수령해주세요':'카드키와 영수증을 발급하고 있어요'}</div>
   <div class="psub">${ready?'프로토타입: 카드를 터치하면 수령돼요':end?'잠시 후 완료 화면으로 이동해요':'잠시만 기다려 주세요'}</div></div>
  <div class="rows">${rows}</div></div></div>`};
};
V.done=()=>{
  const issued=ROOMS.filter(r=>r.issued>0),rem=ROOMS.filter(r=>selectable(r));
  const waitRooms=ROOMS.filter(r=>r.checked===0).length,addPeople=ROOMS.filter(r=>r.checked>0).reduce((s,r)=>s+remaining(r),0);
  const allDone=!rem.length;
  const remCards=rem.map(r=>`<div class="rcard"><div class="th"><img src="${IMGS[r.img]}" alt=""></div><div class="t"><b>${r.type}&nbsp; ${r.id}호</b><span>예약 ${r.booked}명 / 체크인 ${r.checked}명${r.checked?` / 남은 인원 ${remaining(r)}명`:''}</span></div><button data-act="addci" data-v="${r.id}">추가 체크인</button></div>`).join('');
  return {html:`<div class="body"><div class="fin"><div class="head c" style="padding-top:110px"><h1>${allDone?'모든 객실의 체크인이<br>완료되었습니다':'선택한 객실의 체크인이<br>완료되었습니다'}</h1>
  <p class="sub" style="color:var(--sub)">${allDone?'카드키를 객실 도어락에 대면 문이 열려요<br>즐거운 시간 보내세요':'선택한 객실의 카드키가 발급되었으며,<br>남은 객실을 체크인할 수 있습니다'}</p></div>
  <div class="stats"><div><span>카드키 발급 완료</span><b>${issued.length}실</b></div><div><span>체크인 대기</span><b>${waitRooms}실</b></div><div><span>추가 체크인</span><b>${addPeople}명</b></div></div>
  <div class="acc ${st.expanded?'open':''}"><button data-act="acc" aria-expanded="${st.expanded}"><span class="ck">${I.check}</span><span class="t"><b>카드키 발급 완료 ${issued.length}실</b><span>${issued.map(r=>r.id+'호').join(' / ')}</span></span>${I.chevD}</button>
  ${st.expanded?`<ul>${issued.map(r=>`<li><b>${r.type} ${r.id}호</b><span>체크인 ${r.checked}명 · 카드키 ${r.issued}장</span></li>`).join('')}</ul>`:''}</div>
  <div class="hr"></div>
  ${allDone?'<div class="allok">남은 체크인이 없어요</div>':`<div class="rem"><h4>남은 체크인 ${rem.length}건</h4>${remCards}</div>`}</div></div>
  ${foot(allDone?'마일리지 적립하기':'남은 체크인 진행',{prevAct:'finish',act:allDone?'mileage':'more'}).replace('>이전<','>종료<')}`};
};

function modal(){
  const m=st.modal;if(!m){st.lastModal=null;return ''}
  const still=st.lastModal===m;st.lastModal=m;
  const wrap=(inner,closable=true)=>`<div class="overlay ${still?'still':''}" data-act="${closable?'mclose':''}"><div class="modal" role="dialog" aria-modal="true" data-act="noop">${closable?`<button class="x" data-act="mclose" aria-label="닫기">${I.x}</button>`:''}${inner}</div></div>`;
  if(m==='minor')return wrap(`<div class="micon">${I.idcard}</div><h2>미성년자가 있나요?</h2><p class="ms">투숙객 중 만 19세 미만이 포함된 경우<br>추가 확인이 필요합니다.</p>
    <div class="notice">${I.info}<b>청소년 투숙 안내</b><ul><li><span class="hp">「</span>청소년 보호법」에서 금지하는 청소년의 이성 혼숙 등은 허용되지 않습니다.</li><li>실제와 다르게 선택하신 경우 현장에서 신분 확인이 진행될 수 있습니다.</li></ul></div>
    <div class="mbtns"><button class="o" data-act="hasminor">미성년자 포함</button><button class="p" data-act="alladult">모두 성인</button></div>`);
  if(m==='minorstaff')return wrap(`<div class="micon">${I.idcard}</div><h2>직원 확인이 필요해요</h2><p class="ms">미성년자가 포함된 투숙은 직원이 신분을 확인한 뒤<br>체크인을 이어서 진행해요. 직원을 호출했어요.</p>
    <div class="mbtns"><button class="p" data-act="mclose">확인</button></div>`);
  if(m==='staff')return wrap(`<div class="micon"><svg viewBox="0 0 40 40" width="110" height="110" fill="none" stroke="#4A22E0" stroke-width="2" stroke-linecap="round"><path d="M8 24v-4a12 12 0 0 1 24 0v4"/><rect x="5" y="23" width="5" height="8" rx="2"/><rect x="30" y="23" width="5" height="8" rx="2"/><path d="M32 31c0 3-3 4-7 4"/></svg></div><h2>직원을 호출했어요</h2><p class="ms">프런트 직원이 곧 도와드릴게요.<br>잠시만 기다려 주세요.</p>
    <div class="mbtns"><button class="p" data-act="mclose">확인</button></div>`);
  if(m==='id')return wrap(`<div class="micon">${I.idcard}</div><h2>신분증을 넣어 주세요</h2><p class="ms">사진이 위로 오도록 신분증을<br>스캐너 투입구에 넣어 주세요.</p>
    <div class="mbtns"><button class="o" data-act="mclose">취소</button><button class="p" data-act="idok">인식 시뮬레이션</button></div>`);
  if(m==='home')return wrap(`<h2 style="margin-top:40px">처음으로 돌아갈까요?</h2><p class="ms">지금까지 진행한 체크인 정보가 사라져요.<br>이미 발급된 카드키는 그대로 사용할 수 있어요.</p>
    <div class="mbtns"><button class="o" data-act="mclose">계속 진행</button><button class="p" data-act="doreset">처음으로</button></div>`);
  if(m==='mileage')return wrap(`<div class="micon">${I.mile}</div><h2>마일리지를 적립할까요?</h2><p class="ms">예약자 연락처 <b style="color:var(--ink)">${RES.phone}</b>로<br>전체 예약의 마일리지가 적립돼요.</p>
    <div class="mbtns"><button class="o" data-act="mclose">취소</button><button class="p" data-act="mileok">적립하기</button></div>
    <button class="mlink" data-act="mother">다른 전화번호로 적립하기</button>`);
  if(m==='mother'){const d=st.mInput||'';let mid='',last='';
    for(let i=0;i<4;i++)mid+=`<i class="dot ${i<d.length?'on':''}"></i>`;
    for(let i=4;i<8;i++)last+=i<d.length?`<span>${d[i]}</span>`:'<span class="ph">0</span>';
    return wrap(`<h2 style="margin-top:40px">다른 전화번호로 적립</h2><p class="ms">마일리지를 적립할 휴대폰 번호를 입력해 주세요</p>
    <div class="field mfield"><span>010</span><span class="dash">-</span>${mid}<span class="dash">-</span>${last}</div>
    <div class="pad mpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="mkey" data-v="${n}">${n}</button>`).join('')}<button class="sm" data-act="mclear">초기화</button><button data-act="mkey" data-v="0">0</button><button data-act="mback" aria-label="지우기">${I.back}</button></div>
    <div class="mbtns" style="margin-top:56px"><button class="p" data-act="mileok2" ${d.length===8?'':'disabled'}>적립하기</button></div>`)}
  if(m==='mileok')return wrap(`<div class="micon">${I.mile}</div><h2>마일리지가 적립되었습니다</h2><p class="ms"><b style="color:var(--ink)">${st.mPhone||RES.phone}</b>로<br>전체 예약의 마일리지가 적립됐어요.</p>
    <div class="mbtns"><button class="p" data-act="doreset">처음 화면으로</button></div>`,false);
  if(m==='bye')return wrap(`<div class="micon">${I.phone}</div><h2>체크인이 끝났어요</h2><p class="ms">카드키를 객실 도어락에 대면 문이 열려요.<br>즐거운 시간 보내세요.</p>
    <div class="mbtns"><button class="p" data-act="doreset">처음 화면으로</button></div>`,false);
  return '';
}

let busy=false;
function render(){
  const v=V[st.screen]();
  stage.classList.toggle('gray',!!v.gray);
  if(!document.getElementById('stp')){stage.innerHTML='<div id="stp"></div><div id="view"></div>'}
  updateStepper();
  const view=document.getElementById('view');
  const changed=st.shown!==st.screen;st.shown=st.screen;
  view.className=changed?'enter':'';
  const oldSc=changed?null:view.querySelector('.scroll,.fin'),keep=oldSc?oldSc.scrollTop:0;
  view.innerHTML=v.html+modal();
  if(oldSc){const sc=view.querySelector('.scroll,.fin');if(sc)sc.scrollTop=keep}
  const bar=view.querySelector('.bar i[data-w]');
  if(bar){const w=+bar.dataset.w;st.lastPct=w;requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=w+'%'}))}
}
function updateStepper(){
  const box=document.getElementById('stp');
  if(!box.children.length){box.outerHTML=stepper().replace('class="stepper"','id="stp" class="stepper"');return updateStepper()}
  const cur=STEP_OF[st.screen];
  [...box.children].forEach((el,i)=>{const n=i+1,cls='st '+(n<cur?'done':n===cur?'cur':''),c=el.firstElementChild,inner=n<cur?I.check:String(n);
    if(el.className!==cls)el.className=cls;
    if(c.dataset.s!==inner){c.innerHTML=inner;c.dataset.s=inner}});
  box.setAttribute('aria-label',`진행 단계 ${cur}/6`);
}

function act(a,v){
  const s=st;
  switch(a){
    case 'tab':s.tab=v;s.input='';s.err='';break;
    case 'key':{const max=s.tab==='phone'?(s.cc==='+82'?8:12):6;if(s.input.length<max)s.input+=v;s.err='';break}
    case 'ccopen':s.ccOpen=!s.ccOpen;break;
    case 'ccclose':s.ccOpen=false;break;
    case 'ccpick':if(s.cc!==v){s.cc=v;s.input=''}s.ccOpen=false;s.err='';break;
    case 'kclear':s.input='';s.err='';break;
    case 'kback':s.input=s.input.slice(0,-1);break;
    case 'lookup':
      if(s.tab==='phone'){const d=s.input;
        if(s.cc==='+82'){RES.phone=`010-****-${d.slice(4)}`;RES.full=`010 ${d.slice(0,4)} ${d.slice(4)}`}
        else{RES.phone=`${s.cc} ${'*'.repeat(Math.max(0,d.length-4))}${d.slice(-4)}`;RES.full=`${s.cc} ${d}`}}
      return go('rooms');
    case 'qrscan':return go('rooms');
    case 'room':{const id=+v,i=s.sel.indexOf(id);i<0?s.sel.push(id):s.sel.splice(i,1);s.sel.sort();break}
    case 'all':{const av=ROOMS.filter(canAdd).map(r=>r.id);s.sel=av.every(id=>s.sel.includes(id))?[]:av;break}
    case 'next':
      if(s.screen==='rooms'){s.guests={};return go('guests')}
      if(s.screen==='guests')return go('terms');
      break;
    case 'prev':{const back={rooms:'lookup',guests:'rooms',terms:'guests',auth:'terms'};return go(back[s.screen]||'lookup')}
    case 'minus':s.guests[v]=Math.max(1,s.guests[v]-1);break;
    case 'plus':{const r=room(+v);s.guests[v]=Math.min(r.max-r.checked,s.guests[v]+1);break}
    case 'agree':s.modal='minor';break;
    case 'alladult':return go('guide');
    case 'hasminor':s.modal='minorstaff';break;
    case 'skipguide':return go('auth');
    case 'qrauth':case 'idok':
      if(s.authDone<authTotal()){s.authDone++;s.authLog.push(other());if(s.authDone>=authTotal())clearT()}
      s.modal=null;break;
    case 'idauth':s.modal='id';break;
    case 'authnext':{
      const addOn=s.sel.filter(id=>room(id).issued>0),fresh=s.sel.filter(id=>room(id).issued===0);
      addOn.forEach(id=>{room(id).checked+=s.guests[id]});
      s.sel=fresh;
      return go(fresh.length?'issue':'done');
    }
    case 'take':return take();
    case 'acc':s.expanded=!s.expanded;break;
    case 'more':s.sel=[];return go('rooms');
    case 'addci':s.sel=[+v];s.guests={};return go('guests');
    case 'mileage':s.modal='mileage';s.mInput='';s.mPhone='';break;
    case 'mother':s.modal='mother';s.mInput='';break;
    case 'mileback':s.modal='mileage';break;
    case 'mkey':if((s.mInput||'').length<8)s.mInput=(s.mInput||'')+v;break;
    case 'mclear':s.mInput='';break;
    case 'mback':s.mInput=(s.mInput||'').slice(0,-1);break;
    case 'mileok2':s.mPhone=`010-****-${s.mInput.slice(4)}`;s.modal='mileok';render();later(reset,6000);return;
    case 'mileok':s.modal='mileok';render();later(reset,6000);return;
    case 'finish':s.modal='bye';render();later(reset,6000);return;
    case 'home':if(s.screen==='lookup'){return reset()}s.modal='home';break;
    case 'doreset':return reset();
    case 'staff':s.modal='staff';break;
    case 'mclose':s.modal=null;break;
    case 'noop':return;
  }
  render();
}

stage.addEventListener('click',e=>{
  if(busy)return;
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const a=el.dataset.act;if(!a)return;
  if(a==='noop'&&e.target.closest('[data-act]')===el)return;
  act(a,el.dataset.v);
});

function fit(){
  const vp=document.getElementById('viewport');
  const s=Math.min((vp.clientWidth-24)/1634,(vp.clientHeight-24)/1001);
  document.getElementById('kiosk').style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',fit);
reset();fit();
})();
</script>
